name: flutter_test_task
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  firebase_storage: ^12.3.8
  cloud_firestore: ^5.6.0

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.1.0
  path_provider: ^2.1.5
  uuid: ^4.5.2
  image_picker: ^1.1.2
  flutter_local_notifications: ^18.0.1
  equatable: ^2.0.8
  flutter_bloc: ^8.1.6
  get_it: ^8.0.3
  rxdart: ^0.28.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  flutter_gen_runner: ^5.8.0
  build_runner: ^2.4.13


flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: PressStart2P
      fonts:
        - asset: assets/fonts/PressStart2P-Regular.ttf
